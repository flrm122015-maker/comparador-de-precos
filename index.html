<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06183d"><meta name="description" content="Comparador de preços de produtos de supermercado"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Comparador de Preços</title><style>
:root{--n:#031333;--n2:#072457;--b:#1684ff;--c:#00d5ff;--w:#fff;--m:#aec3e5;--l:#2c83ed55;--g:#59e6a3;--r:#ff7180}*{box-sizing:border-box}html,body{margin:0;background:#020b1d;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{background:radial-gradient(circle at 85% 10%,#008cff2b,transparent 28%),linear-gradient(145deg,#020b1d,#06183d 50%,#020b1d)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:720px;min-height:100vh;margin:auto}.header{position:sticky;top:0;z-index:10;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;background:#03152be8;backdrop-filter:blur(18px);border-bottom:1px solid #3d8dff25}.brand{display:flex;gap:10px;align-items:center}.logo{width:47px;height:47px;border-radius:15px;background:linear-gradient(145deg,#2b91ff,#0754d7);display:grid;place-items:center;box-shadow:0 0 25px #008cff55}.logo svg{width:31px}.brand b{font-size:18px}.brand span{display:block;color:#1994ff;font-size:12px;font-weight:900;letter-spacing:2px}.ha{display:flex;gap:8px}.ib{width:42px;height:42px;border:1px solid var(--l);border-radius:13px;background:#ffffff0d;color:#fff}.main{padding:22px 18px 112px}.page{display:none}.page.active{display:block}.hero{min-height:180px;position:relative;padding:8px 0 20px}.hero h1{font-size:40px;line-height:1;margin:10px 0}.hero p{font-size:17px;line-height:1.45;color:var(--m);max-width:430px}.chart{position:absolute;right:-30px;bottom:8px;width:55%;opacity:.75}.search{display:flex;gap:8px;background:#fff;padding:7px;border-radius:19px;box-shadow:0 15px 35px #0004;margin-bottom:18px}.search input{flex:1;min-width:0;border:0;outline:0;padding:12px;color:#315078}.search button,.primary{border:0;border-radius:14px;background:linear-gradient(135deg,#2c8fff,#0757d8);color:#fff;font-weight:850;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat,.card,.product{background:linear-gradient(145deg,#09295dcc,#03193ee8);border:1px solid #2789ff55;border-radius:19px;box-shadow:0 12px 28px #0003}.stat{padding:15px}.bubble,.qicon{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#198cff,#0757d9);box-shadow:0 0 20px #008cff55;margin-bottom:9px}.stat b{display:block;font-size:23px}.stat small{color:var(--m)}.quick{display:grid;grid-template-columns:repeat(4,1fr);padding:10px;margin:16px 0 25px;border:1px solid #148bff88;border-radius:20px;background:#051e48cc}.quick button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px}.quick button+button{border-left:1px solid #6da9ff22}.qicon{width:50px;height:50px;border-radius:15px;font-size:25px;margin:0}.quick span{font-size:12px;font-weight:800;text-align:center}.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sh h2{margin:0;font-size:20px}.link{border:0;background:none;color:#168fff;font-weight:850}.products{display:grid;gap:12px}.product{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:12px}.pimg,.thumb{width:78px;height:78px;border-radius:14px;object-fit:cover;background:#eaf2ff}.pn{font-weight:850}.meta,.sub{font-size:12px;color:var(--m);line-height:1.45}.price{font-size:20px;color:#1b96ff;font-weight:900;text-align:right}.store{font-size:11px;color:#b6c8e5;text-align:right}.badge{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:99px;background:#31e08e18;color:var(--g);font-size:10px;font-weight:850}.bottom{position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);width:min(684px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border:1px solid #2c8cff66;border-radius:22px;background:#031431f2;backdrop-filter:blur(18px);box-shadow:0 18px 45px #0006}.bottom button{border:0;background:none;color:var(--m);border-radius:16px;padding:8px 2px;font-size:11px}.bottom button.active{color:#fff;background:#1684ff26}.section{margin-bottom:14px}.field label{display:block;font-size:12px;color:#c5d6ef;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:13px;border:1px solid #5c9dff44;background:#061d47;color:#fff;outline:0}.form{display:grid;gap:12px}.card{padding:16px;margin-bottom:14px}.listrow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #6fa0e522}.listrow:last-child{border-bottom:0}.thumb{width:56px;height:56px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.secondary,.danger{padding:7px 9px;border-radius:11px;font-weight:800}.secondary{background:#ffffff0b;border:1px solid var(--l);color:#fff}.danger{background:#ff506e18;border:1px solid #ff718055;color:#ff9da8}.empty{text-align:center;padding:30px;color:var(--m)}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#0009;backdrop-filter:blur(7px)}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#06183b;border:1px solid var(--l);border-radius:24px 24px 0 0;padding:20px}.sheeth{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheeth h2{margin:0}.photo{border:1px dashed #479bff88;border-radius:16px;padding:12px;text-align:center}.preview{display:none;max-width:100%;max-height:190px;border-radius:12px;margin:auto}.toast{position:fixed;z-index:80;left:50%;bottom:95px;transform:translate(-50%,15px);opacity:0;background:#fff;color:#12305e;padding:12px 16px;border-radius:13px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}.main{padding-left:28px;padding-right:28px}.hero h1{font-size:45px}}@media(max-width:390px){.product{grid-template-columns:65px 1fr}.pimg{width:65px;height:65px}.price,.store{text-align:left;grid-column:2}.search button{padding:0 14px}}
</style></head><body><div class="app"><header class="header"><div class="brand"><div class="logo"><svg viewBox="0 0 48 48" fill="none"><path d="M7 10h6l4 22h19l5-16H15" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="39" r="3" fill="#00d4ff"/><circle cx="35" cy="39" r="3" fill="#00d4ff"/><path d="M25 13v11m-5-6 5-5 5 5" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/></svg></div><div><b>Comparador</b><span>DE PREÇOS</span></div></div><div class="ha"><button class="ib" onclick="toast('Você não possui novas notificações.')">🔔</button><button class="ib" onclick="toast('Perfil local do usuário.')">◯</button></div></header><main class="main">
<section id="home" class="page active"><div class="hero"><h1>Olá, Fabrício!</h1><p>Encontre os melhores preços e economize mais todos os dias.</p><svg class="chart" viewBox="0 0 500 220" fill="none"><path d="M15 195 110 140l75 42 95-115 75 54 110-94" stroke="#0b83ff" stroke-width="5"/><g fill="#00d5ff"><circle cx="110" cy="140" r="5"/><circle cx="185" cy="182" r="5"/><circle cx="280" cy="67" r="5"/><circle cx="355" cy="121" r="5"/><circle cx="465" cy="27" r="6"/></g></svg></div><form id="search" class="search"><input id="q" placeholder="Buscar produto..."><button>Buscar</button></form><div class="stats"><div class="stat"><div class="bubble">🏷️</div><b id="sp">0</b><small>Produtos cadastrados</small></div><div class="stat"><div class="bubble">🏪</div><b id="ss">0</b><small>Lojas cadastradas</small></div><div class="stat"><div class="bubble">📈</div><b id="sq">0</b><small>Pesquisas realizadas</small></div><div class="stat"><div class="bubble">💰</div><b id="se">R$ 0,00</b><small>Economia estimada</small></div></div><div class="quick"><button onclick="productForm()"><div class="qicon">＋</div><span>Cadastrar<br>Produto</span></button><button onclick="storeForm()"><div class="qicon">🏪</div><span>Cadastrar<br>Loja</span></button><button onclick="toast('Nesta versão, o código de barras pode ser digitado no cadastro.')"><div class="qicon">▥</div><span>Escanear<br>Código</span></button><button onclick="page('history')"><div class="qicon">◷</div><span>Histórico<br>de Preços</span></button></div><div class="sh"><h2>Produtos em destaque</h2><button class="link" onclick="page('products')">Ver todos ›</button></div><div id="featured" class="products"></div></section>
<section id="products" class="page"><div class="sh"><h2>Produtos</h2><button class="primary" onclick="productForm()">＋ Novo</button></div><div class="card"><div class="field"><label>Pesquisar produtos</label><input id="pf" oninput="renderProducts()" placeholder="Nome, marca ou categoria..."></div></div><div id="plist" class="card"></div></section>
<section id="stores" class="page"><div class="sh"><h2>Lojas</h2><button class="primary" onclick="storeForm()">＋ Nova</button></div><div id="slist" class="card"></div></section>
<section id="compare" class="page"><div class="sh"><h2>Comparar preços</h2></div><div class="card"><div class="field"><label>Produto</label><select id="cp" onchange="compare()"></select></div></div><div id="comparison"></div></section>
<section id="history" class="page"><div class="sh"><h2>Histórico de preços</h2></div><div id="hlist" class="card"></div></section></main><nav class="bottom"><button data-page="home" class="active">⌂<br>Início</button><button data-page="products">🏷<br>Produtos</button><button data-page="stores">🏪<br>Lojas</button><button data-page="compare">📈<br>Comparar</button><button onclick="toast('Navegação: use os botões abaixo para acessar as áreas do app.')">☰<br>Mais</button></nav><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet"><div class="sheeth"><h2 id="mt">Cadastrar produto</h2><button class="ib" onclick="closeModal()">✕</button></div><div id="mc"></div></div></div></div>
<script>
const K='comparador_pwa_v3';let S=JSON.parse(localStorage.getItem(K)||'null')||{products:[],stores:[],history:[],searches:0};const $=x=>document.getElementById(x);const money=x=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(x)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const storeName=id=>S.stores.find(s=>s.id===id)?.name||'Loja não informada';function save(){localStorage.setItem(K,JSON.stringify(S));render()}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function page(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.bottom [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));render();scrollTo(0,0)}document.querySelectorAll('.bottom [data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));function img(p){return p.photo||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="22" fill="#eaf2ff"/><text x="80" y="98" text-anchor="middle" font-size="62">🛒</text></svg>')}
function productForm(id){let p=S.products.find(x=>x.id===id)||{name:'',brand:'',category:'',barcode:'',price:'',storeId:'',photo:''};$('mt').textContent=id?'Editar produto':'Cadastrar produto';$('mc').innerHTML=`<form id="form" class="form"><div class="field"><label>Nome do produto *</label><input id="name" required value="${esc(p.name)}" placeholder="Ex.: Arroz Tio João 5kg"></div><div class="field"><label>Marca</label><input id="brand" value="${esc(p.brand)}"></div><div class="field"><label>Categoria</label><input id="cat" value="${esc(p.category)}"></div><div class="field"><label>Código de barras</label><input id="bar" inputmode="numeric" value="${esc(p.barcode)}"></div><div class="field"><label>Preço *</label><input id="price" required type="number" step="0.01" min="0" value="${p.price}"></div><div class="field"><label>Loja</label><select id="store"><option value="">Selecione</option>${S.stores.map(s=>`<option value="${s.id}" ${s.id===p.storeId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="photo"><img id="prev" class="preview" src="${p.photo}"><div id="ph">📷<br>Adicionar foto do produto</div><input id="file" type="file" accept="image/*" capture="environment"></div><div class="actions"><button class="primary">${id?'Salvar alterações':'Salvar produto'}</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`;if(p.photo){$('prev').style.display='block';$('ph').style.display='none'}$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{$('prev').src=ev.target.result;$('prev').style.display='block';$('ph').style.display='none'};r.readAsDataURL(f)};$('form').onsubmit=e=>{e.preventDefault();let o={id:id||crypto.randomUUID(),name:$('name').value.trim(),brand:$('brand').value.trim(),category:$('cat').value.trim(),barcode:$('bar').value.trim(),price:Number($('price').value),storeId:$('store').value,photo:$('prev').src||''};if(id)S.products[S.products.findIndex(x=>x.id===id)]=o;else S.products.push(o);S.history.unshift({id:crypto.randomUUID(),productId:o.id,price:o.price,storeId:o.storeId,date:new Date().toISOString()});save();closeModal();toast(id?'Produto atualizado!':'Produto cadastrado!')};$('modal').classList.add('open')}
function storeForm(id){let s=S.stores.find(x=>x.id===id)||{name:'',address:'',phone:''};$('mt').textContent=id?'Editar loja':'Cadastrar loja';$('mc').innerHTML=`<form id="form" class="form"><div class="field"><label>Nome da loja *</label><input id="sn" required value="${esc(s.name)}"></div><div class="field"><label>Endereço</label><input id="sa" value="${esc(s.address)}"></div><div class="field"><label>Telefone</label><input id="spn" value="${esc(s.phone)}"></div><div class="actions"><button class="primary">Salvar loja</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`;$('form').onsubmit=e=>{e.preventDefault();let o={id:id||crypto.randomUUID(),name:$('sn').value.trim(),address:$('sa').value.trim(),phone:$('spn').value.trim()};if(id)S.stores[S.stores.findIndex(x=>x.id===id)]=o;else S.stores.push(o);save();closeModal();toast(id?'Loja atualizada!':'Loja cadastrada!')};$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function render(){let savings=0;S.products.forEach(p=>{let a=S.history.filter(h=>h.productId===p.id).map(h=>h.price);if(a.length>1)savings+=Math.max(...a)-Math.min(...a)});$('sp').textContent=S.products.length;$('ss').textContent=S.stores.length;$('sq').textContent=S.searches;$('se').textContent=money(savings);let f=[...S.products].sort((a,b)=>a.price-b.price).slice(0,5);$('featured').innerHTML=f.length?f.map(p=>`<article class="product"><img class="pimg" src="${img(p)}"><div><div class="pn">${esc(p.name)}</div><div class="meta">${esc(p.brand||p.category||'Produto')}<br>${esc(storeName(p.storeId))}</div><span class="badge">Menor preço cadastrado</span></div><div><div class="price">${money(p.price)}</div><div class="store">Ver preços ›</div></div></article>`).join(''):'<div class="card empty">Nenhum produto cadastrado.<br><button class="primary" style="margin-top:12px;padding:11px" onclick="productForm()">Cadastrar primeiro produto</button></div>';renderProducts();renderStores();compare();renderHistory()}
function renderProducts(){if(!$('plist'))return;let q=($('pf')?.value||'').toLowerCase(),a=S.products.filter(p=>(p.name+' '+p.brand+' '+p.category).toLowerCase().includes(q));$('plist').innerHTML=a.length?a.map(p=>`<div class="listrow"><img class="thumb" src="${img(p)}"><div><b>${esc(p.name)}</b><div class="sub">${esc(p.brand||'')} ${p.category?'• '+esc(p.category):''}<br>${esc(storeName(p.storeId))}</div></div><div><b class="price">${money(p.price)}</b><div class="actions"><button class="secondary" onclick="productForm('${p.id}')">Editar</button><button class="danger" onclick="del('${p.id}')">Excluir</button></div></div></div>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}function del(id){if(!confirm('Excluir este produto?'))return;S.products=S.products.filter(p=>p.id!==id);S.history=S.history.filter(h=>h.productId!==id);save();toast('Produto excluído.')}
function renderStores(){$('slist').innerHTML=S.stores.length?S.stores.map(s=>`<div class="listrow"><div class="thumb" style="display:grid;place-items:center;font-size:25px">🏪</div><div><b>${esc(s.name)}</b><div class="sub">${esc(s.address||'Endereço não informado')}<br>${esc(s.phone||'')}</div></div><button class="secondary" onclick="storeForm('${s.id}')">Editar</button></div>`).join(''):'<div class="empty">Nenhuma loja cadastrada.<br><button class="primary" style="margin-top:12px;padding:11px" onclick="storeForm()">Cadastrar primeira loja</button></div>'}
function compare(){let c=$('cp');if(!c)return;let old=c.value;c.innerHTML='<option value="">Selecione um produto</option>'+S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(old)c.value=old;let p=S.products.find(x=>x.id===c.value);if(!p){$('comparison').innerHTML='<div class="card empty">Escolha um produto para comparar os preços.</div>';return}let a=S.history.filter(h=>h.productId===p.id);let g={};a.forEach(h=>{let k=h.storeId||'none';if(!g[k]||h.price<g[k].price)g[k]=h});if(!Object.keys(g).length)g[p.storeId||'none']={price:p.price,storeId:p.storeId};let v=Object.values(g).sort((x,y)=>x.price-y.price),min=v[0].price;$('comparison').innerHTML=v.map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(storeName(x.storeId))}</b><div class="sub">${x.price===min?'🏆 Melhor preço':'Preço cadastrado'}</div></div><strong class="price">${money(x.price)}</strong></div>`).join('')}
function renderHistory(){let a=S.history.slice(0,60);$('hlist').innerHTML=a.length?a.map(h=>{let p=S.products.find(x=>x.id===h.productId);return p?`<div class="listrow"><img class="thumb" src="${img(p)}"><div><b>${esc(p.name)}</b><div class="sub">${esc(storeName(h.storeId))}<br>${new Date(h.date).toLocaleString('pt-BR')}</div></div><b class="price">${money(h.price)}</b></div>`:''}).join(''):'<div class="empty">O histórico aparecerá aqui quando você cadastrar preços.</div>'}
$('search').onsubmit=e=>{e.preventDefault();let q=$('q').value.trim();if(!q)return;S.searches++;save();page('products');$('pf').value=q;renderProducts()};if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));render();
</script></body></html>
