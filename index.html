<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06183d">
<meta name="description" content="Comparador de preços de produtos de supermercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Comparador de Preços</title>

<style>
:root{
  --bg:#020b1d;--bg2:#06183d;--card:#09295c;--blue:#1684ff;
  --blue2:#0757d8;--cyan:#00d5ff;--text:#fff;--muted:#aec3e5;
  --line:#2789ff55;--green:#59e6a3;--danger:#ff7180;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 85% 5%,#008cff2d,transparent 28%),
    radial-gradient(circle at 10% 45%,#2945ff1c,transparent 30%),
    linear-gradient(145deg,#020b1d,#06183d 50%,#020b1d);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

.app{width:100%;max-width:760px;min-height:100vh;margin:auto}
.header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#03152bf2;
  border-bottom:1px solid #3d8dff25;backdrop-filter:blur(18px)
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#2b91ff,#0754d7);
  box-shadow:0 0 25px #008cff55
}
.logo svg{width:30px}
.brand b{display:block;font-size:18px}
.brand span{display:block;color:#1994ff;font-size:10px;font-weight:bold;letter-spacing:2px}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border:1px solid #2c83ed55;border-radius:12px;
  background:#ffffff0d;color:#fff
}

main{padding:22px 18px 115px}
.page{display:none}.page.active{display:block}

.hero{position:relative;min-height:185px;padding:5px 0 20px;overflow:hidden}
.hero h1{position:relative;z-index:1;font-size:44px;line-height:1;margin:10px 0}
.hero p{position:relative;z-index:1;max-width:440px;color:var(--muted);font-size:16px;line-height:1.5}
.chart{position:absolute;right:-25px;bottom:8px;width:58%;opacity:.72}

.search{
  display:flex;gap:8px;padding:7px;margin-bottom:17px;
  background:#fff;border-radius:18px;box-shadow:0 15px 35px #0005
}
.search input{
  flex:1;min-width:0;border:0;outline:0;padding:12px;color:#315078;
  font-size:15px
}
.primary{
  border:0;border-radius:13px;padding:11px 17px;
  background:linear-gradient(135deg,#2c8fff,#0757d8);color:#fff;font-weight:bold
}
.search .primary{padding:0 20px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat,.card,.product-card{
  background:linear-gradient(145deg,#09295ce6,#03193ee8);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 28px #0003
}
.stat{padding:13px}
.stat-icon,.quick-icon{
  display:grid;place-items:center;
  width:38px;height:38px;margin-bottom:8px;border-radius:50%;
  background:linear-gradient(145deg,#198cff,#0757d9);
  box-shadow:0 0 20px #008cff55
}
.stat strong{display:block;font-size:21px}
.stat small{color:var(--muted);font-size:11px;line-height:1.35}

.quick{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;padding:9px;margin:15px 0 25px;
  border:1px solid #148bff88;border-radius:19px;background:#051e48cc
}
.quick button{
  border:0;background:none;color:#fff;padding:7px 2px;
  display:flex;flex-direction:column;align-items:center;gap:6px
}
.quick button+button{border-left:1px solid #6da9ff22}
.quick-icon{width:47px;height:47px;border-radius:14px;font-size:22px;margin:0}
.quick span{font-size:11px;font-weight:bold;text-align:center}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.section-head h2{margin:0;font-size:20px}
.link-btn{border:0;background:none;color:#168fff;font-weight:bold}

.products{display:grid;gap:11px}
.product-card{
  display:grid;grid-template-columns:72px minmax(0,1fr) auto;
  gap:10px;align-items:center;padding:10px
}
.product-img{
  width:72px;height:72px;border-radius:13px;object-fit:cover;background:#eaf2ff
}
.product-name{font-weight:bold;word-break:break-word}
.meta{font-size:11px;color:var(--muted);line-height:1.45}
.price{font-size:18px;color:#1b96ff;font-weight:900;text-align:right;white-space:nowrap}
.price-store{font-size:10px;color:#b6c8e5;text-align:right;max-width:120px}
.badge{
  display:inline-block;margin-top:5px;padding:4px 8px;border-radius:99px;
  background:#31e08e18;color:var(--green);font-size:9px;font-weight:bold
}

.card{padding:16px;margin-bottom:13px}
.form{display:grid;gap:12px}
.field label{display:block;margin-bottom:6px;color:#c5d6ef;font-size:12px;font-weight:bold}
.field input,.field select{
  width:100%;padding:12px;border:1px solid #5c9dff44;border-radius:12px;
  outline:0;background:#061d47;color:#fff
}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.secondary,.danger{
  border-radius:10px;padding:7px 9px;font-weight:bold
}
.secondary{background:#ffffff0b;border:1px solid #2c83ed55;color:#fff}
.danger{background:#ff506e18;border:1px solid #ff718055;color:#ff9da8}

.list{display:grid;gap:0}
.list-row{
  display:grid;grid-template-columns:54px minmax(0,1fr) auto;
  gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #6fa0e522
}
.list-row:last-child{border-bottom:0}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#eaf2ff}
.empty{text-align:center;padding:28px;color:var(--muted);line-height:1.5}

.modal{
  position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;
  background:#0009;backdrop-filter:blur(7px)
}
.modal.open{display:flex}
.sheet{
  width:min(760px,100%);max-height:92vh;overflow:auto;
  padding:20px;background:#06183d;border:1px solid #2c83ed55;
  border-radius:24px 24px 0 0
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.sheet-head h2{margin:0;font-size:20px}

.photo-box{
  padding:12px;text-align:center;border:1px dashed #479bff88;
  border-radius:15px;color:var(--muted)
}
.preview{display:none;max-width:100%;max-height:180px;margin:0 auto 10px;border-radius:12px}

.bottom-nav{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
  z-index:30;width:min(720px,calc(100% - 20px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;
  border:1px solid #2c8cff66;border-radius:22px;background:#031431f5;
  backdrop-filter:blur(18px);box-shadow:0 18px 45px #0006
}
.bottom-nav button{
  border:0;background:none;color:var(--muted);border-radius:15px;
  padding:8px 2px;font-size:10px
}
.bottom-nav button.active{color:#fff;background:#1684ff26}

.toast{
  position:fixed;left:50%;bottom:92px;z-index:80;
  transform:translate(-50%,15px);opacity:0;
  padding:11px 15px;border-radius:12px;background:#fff;color:#12305e;
  font-weight:bold;transition:.25s;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.compare-result{display:grid;gap:10px}
.compare-card{
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.best{border-color:#31e08e66;box-shadow:0 0 25px #31e08e12}

@media(max-width:619px){
  .header{padding:12px 13px}
  main{padding:18px 13px 108px}
  .hero{min-height:165px}
  .hero h1{font-size:34px;max-width:72%}
  .hero p{font-size:14px;max-width:78%}
  .chart{right:-52px;width:63%;opacity:.58}
  .stats{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:11px}.stat strong{font-size:19px}
  .quick{padding:7px}.quick-icon{width:43px;height:43px;font-size:20px}
  .quick span{font-size:10px}
  .product-card{grid-template-columns:62px minmax(0,1fr) auto;gap:8px}
  .product-img{width:62px;height:62px}.price{font-size:16px}
  .price-store{font-size:9px;max-width:92px}
  .brand b{font-size:16px}.brand span{font-size:9px}
  .logo{width:42px;height:42px}.icon-btn{width:37px;height:37px}
  .search input{font-size:14px;padding:11px 8px}
  .search .primary{padding:0 14px}
}

@media(max-width:370px){
  .hero h1{font-size:30px}.hero p{font-size:13px}
  .bottom-nav button{font-size:9px}
  .product-card{grid-template-columns:56px minmax(0,1fr) auto}
  .product-img{width:56px;height:56px}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M7 10h6l4 22h19l5-16H15" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="19" cy="39" r="3" fill="#00d4ff"/>
        <circle cx="35" cy="39" r="3" fill="#00d4ff"/>
        <path d="M25 13v11m-5-6 5-5 5 5" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div><b>Comparador</b><span>DE PREÇOS</span></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toast('Você não possui novas notificações.')">🔔</button>
    <button class="icon-btn" onclick="toast('Perfil local do aplicativo.')">◯</button>
  </div>
</header>

<main>

<section id="home" class="page active">
  <div class="hero">
    <h1>Olá, Fabrício!</h1>
    <p>Encontre os melhores preços e economize mais todos os dias.</p>
    <svg class="chart" viewBox="0 0 500 220" fill="none" aria-hidden="true">
      <path d="M15 195 110 140l75 42 95-115 75 54 110-94" stroke="#0b83ff" stroke-width="5"/>
      <g fill="#00d5ff">
        <circle cx="110" cy="140" r="5"/><circle cx="185" cy="182" r="5"/>
        <circle cx="280" cy="67" r="5"/><circle cx="355" cy="121" r="5"/><circle cx="465" cy="27" r="6"/>
      </g>
    </svg>
  </div>

  <form id="searchForm" class="search">
    <input id="searchInput" placeholder="Buscar produto..." autocomplete="off">
    <button class="primary">Buscar</button>
  </form>

  <div class="stats">
    <div class="stat"><div class="stat-icon">🏷️</div><strong id="statProducts">0</strong><small>Produtos cadastrados</small></div>
    <div class="stat"><div class="stat-icon">🏪</div><strong id="statStores">0</strong><small>Lojas cadastradas</small></div>
    <div class="stat"><div class="stat-icon">📈</div><strong id="statSearches">0</strong><small>Pesquisas realizadas</small></div>
    <div class="stat"><div class="stat-icon">💰</div><strong id="statSavings">R$ 0,00</strong><small>Economia estimada</small></div>
  </div>

  <div class="quick">
    <button onclick="openProduct()"><div class="quick-icon">＋</div><span>Cadastrar<br>Produto</span></button>
    <button onclick="openStore()"><div class="quick-icon">🏪</div><span>Cadastrar<br>Loja</span></button>
    <button onclick="toast('Digite o código de barras no cadastro do produto.')"><div class="quick-icon">▥</div><span>Escanear<br>Código</span></button>
    <button onclick="go('history')"><div class="quick-icon">◷</div><span>Histórico<br>de Preços</span></button>
  </div>

  <div class="section-head">
    <h2>Produtos em destaque</h2>
    <button class="link-btn" onclick="go('products')">Ver todos ›</button>
  </div>
  <div id="featured" class="products"></div>
</section>

<section id="products" class="page">
  <div class="section-head">
    <h2>Produtos</h2>
    <button class="primary" onclick="openProduct()">＋ Novo</button>
  </div>
  <div class="card">
    <div class="field">
      <label>Pesquisar produtos</label>
      <input id="productFilter" oninput="renderProducts()" placeholder="Nome, marca ou categoria...">
    </div>
  </div>
  <div id="productList" class="card list"></div>
</section>

<section id="stores" class="page">
  <div class="section-head">
    <h2>Lojas</h2>
    <button class="primary" onclick="openStore()">＋ Nova</button>
  </div>
  <div id="storeList" class="card list"></div>
</section>

<section id="compare" class="page">
  <div class="section-head"><h2>Comparar preços</h2></div>
  <div class="card">
    <div class="field">
      <label>Escolha o produto</label>
      <select id="compareProduct" onchange="renderCompare()"></select>
    </div>
  </div>
  <div id="compareResult" class="compare-result"></div>
</section>

<section id="history" class="page">
  <div class="section-head"><h2>Histórico de preços</h2></div>
  <div id="historyList" class="card list"></div>
</section>

</main>

<nav class="bottom-nav">
  <button data-page="home" class="active">⌂<br>Início</button>
  <button data-page="products">🏷<br>Produtos</button>
  <button data-page="stores">🏪<br>Lojas</button>
  <button data-page="compare">📈<br>Comparar</button>
  <button data-page="history">☰<br>Mais</button>
</nav>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="modalTitle">Cadastrar produto</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

</div>

<script>
const STORAGE='comparador_pwa_final_v1';

let state={
  products:[],
  stores:[],
  history:[],
  searches:0
};

function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function money(v){
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0)
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
}
function storeName(id){
  const s=state.stores.find(x=>String(x.id)===String(id));
  return s?s.name:'Loja não informada';
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)
}

function migrate(){
  const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');
  if(saved){
    state={...state,...saved};
    return;
  }

  /* Importa automaticamente os dados da versão antiga do projeto,
     caso eles existam no aparelho. */
  const old1=JSON.parse(localStorage.getItem('comparador_pwa_v3')||'null');
  if(old1 && Array.isArray(old1.products)){
    state=old1;
    save();
    return;
  }

  const oldStores=JSON.parse(localStorage.getItem('supermercados')||'null');
  const oldProducts=JSON.parse(localStorage.getItem('produtos')||'null');
  const oldPrices=JSON.parse(localStorage.getItem('precos')||'null');

  if(Array.isArray(oldStores)||Array.isArray(oldProducts)||Array.isArray(oldPrices)){
    state.stores=(oldStores||[]).map(s=>({id:s.id||uid(),name:s.name||s.nome||''}));
    state.products=(oldProducts||[]).map(p=>({
      id:p.id||uid(),name:p.name||p.nome||'',brand:p.brand||'',
      category:p.category||'',barcode:p.barcode||'',price:Number(p.price)||0,
      storeId:p.storeId||'',photo:p.photo||''
    }));

    state.history=(oldPrices||[]).map(p=>({
      id:uid(),productId:p.productId||p.produtoId||'',
      storeId:p.storeId||p.supermercadoId||'',
      price:Number(p.price||p.valor)||0,
      date:p.date||new Date().toISOString()
    }));
    save();
  }
}

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
  document.querySelectorAll('.bottom-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'})
}
document.querySelectorAll('.bottom-nav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));

function productImage(p){
  if(p.photo)return p.photo;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">'+
    '<rect width="160" height="160" rx="22" fill="#eaf2ff"/>'+
    '<text x="80" y="98" text-anchor="middle" font-size="62">🛒</text></svg>'
  );
}

function openProduct(id){
  const p=state.products.find(x=>String(x.id)===String(id))||{
    name:'',brand:'',category:'',barcode:'',price:'',storeId:'',photo:''
  };

  $('modalTitle').textContent=id?'Editar produto':'Cadastrar produto';
  $('modalContent').innerHTML=`
    <form id="productForm" class="form">
      <div class="field"><label>Nome do produto *</label>
        <input id="pName" required value="${esc(p.name)}" placeholder="Ex.: Arroz Tio João 5kg"></div>
      <div class="field"><label>Marca</label><input id="pBrand" value="${esc(p.brand)}"></div>
      <div class="field"><label>Categoria</label><input id="pCategory" value="${esc(p.category)}"></div>
      <div class="field"><label>Código de barras</label><input id="pBarcode" inputmode="numeric" value="${esc(p.barcode)}"></div>
      <div class="field"><label>Preço *</label><input id="pPrice" required type="number" min="0" step="0.01" value="${p.price}"></div>
      <div class="field"><label>Loja</label>
        <select id="pStore"><option value="">Selecione</option>
        ${state.stores.map(s=>`<option value="${esc(s.id)}" ${String(s.id)===String(p.storeId)?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      <div class="photo-box">
        <img id="photoPreview" class="preview" src="${p.photo||''}">
        <div id="photoText">${p.photo?'':'📷 Adicionar foto do produto'}</div>
        <input id="pPhoto" type="file" accept="image/*" capture="environment">
      </div>
      <div class="form-actions">
        <button class="primary">${id?'Salvar alterações':'Salvar produto'}</button>
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
      </div>
    </form>`;

  if(p.photo)$('photoPreview').style.display='block';

  $('pPhoto').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      $('photoPreview').src=ev.target.result;
      $('photoPreview').style.display='block';
      $('photoText').style.display='none';
    };
    reader.readAsDataURL(file)
  };

  $('productForm').onsubmit=e=>{
    e.preventDefault();
    const obj={
      id:id||uid(),
      name:$('pName').value.trim(),
      brand:$('pBrand').value.trim(),
      category:$('pCategory').value.trim(),
      barcode:$('pBarcode').value.trim(),
      price:Number($('pPrice').value),
      storeId:$('pStore').value,
      photo:$('photoPreview').src||''
    };

    if(id){
      const i=state.products.findIndex(x=>String(x.id)===String(id));
      if(i>=0)state.products[i]=obj;
    }else state.products.push(obj);

    state.history.unshift({
      id:uid(),productId:obj.id,storeId:obj.storeId,
      price:obj.price,date:new Date().toISOString()
    });

    save();closeModal();renderAll();
    toast(id?'Produto atualizado!':'Produto cadastrado!');
  };

  $('modal').classList.add('open')
}

function openStore(id){
  const s=state.stores.find(x=>String(x.id)===String(id))||{name:'',address:'',phone:''};
  $('modalTitle').textContent=id?'Editar loja':'Cadastrar loja';
  $('modalContent').innerHTML=`
    <form id="storeForm" class="form">
      <div class="field"><label>Nome da loja *</label><input id="sName" required value="${esc(s.name)}" placeholder="Ex.: Atacadão"></div>
      <div class="field"><label>Endereço</label><input id="sAddress" value="${esc(s.address)}"></div>
      <div class="field"><label>Telefone</label><input id="sPhone" value="${esc(s.phone)}"></div>
      <div class="form-actions">
        <button class="primary">Salvar loja</button>
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
      </div>
    </form>`;

  $('storeForm').onsubmit=e=>{
    e.preventDefault();
    const name=$('sName').value.trim();
    if(!name)return;

    const obj={id:id||uid(),name,address:$('sAddress').value.trim(),phone:$('sPhone').value.trim()};
    if(id){
      const i=state.stores.findIndex(x=>String(x.id)===String(id));
      if(i>=0)state.stores[i]=obj;
    }else state.stores.push(obj);

    save();closeModal();renderAll();
    toast(id?'Loja atualizada!':'Loja cadastrada!');
  };
  $('modal').classList.add('open')
}

function closeModal(){$('modal').classList.remove('open')}

function deleteProduct(id){
  if(!confirm('Excluir este produto?'))return;
  state.products=state.products.filter(p=>String(p.id)!==String(id));
  state.history=state.history.filter(h=>String(h.productId)!==String(id));
  save();renderAll();toast('Produto excluído.')
}

function renderStats(){
  $('statProducts').textContent=state.products.length;
  $('statStores').textContent=state.stores.length;
  $('statSearches').textContent=state.searches;

  let saving=0;
  state.products.forEach(p=>{
    const prices=state.history.filter(h=>String(h.productId)===String(p.id)).map(h=>Number(h.price)).filter(Number.isFinite);
    if(prices.length>1)saving+=Math.max(...prices)-Math.min(...prices);
  });
  $('statSavings').textContent=money(saving);
}

function renderFeatured(){
  const list=[...state.products].sort((a,b)=>Number(a.price)-Number(b.price)).slice(0,5);
  $('featured').innerHTML=list.length?list.map(p=>`
    <article class="product-card">
      <img class="product-img" src="${productImage(p)}" alt="">
      <div>
        <div class="product-name">${esc(p.name)}</div>
        <div class="meta">${esc(p.brand||p.category||'Produto')}<br>${esc(storeName(p.storeId))}</div>
        <span class="badge">Menor preço cadastrado</span>
      </div>
      <div><div class="price">${money(p.price)}</div><div class="price-store">${esc(storeName(p.storeId))}</div></div>
    </article>`).join(''):
    `<div class="card empty">Nenhum produto cadastrado.<br>
      <button class="primary" style="margin-top:12px" onclick="openProduct()">Cadastrar primeiro produto</button>
    </div>`
}

function renderProducts(){
  const q=($('productFilter')?.value||'').toLowerCase();
  const list=state.products.filter(p=>
    (p.name+' '+p.brand+' '+p.category+' '+p.barcode).toLowerCase().includes(q)
  );

  $('productList').innerHTML=list.length?list.map(p=>`
    <div class="list-row">
      <img class="thumb" src="${productImage(p)}" alt="">
      <div>
        <b>${esc(p.name)}</b>
        <div class="meta">${esc(p.brand||'')} ${p.category?'• '+esc(p.category):''}<br>${esc(storeName(p.storeId))}</div>
      </div>
      <div>
        <div class="price">${money(p.price)}</div>
        <div class="form-actions">
          <button class="secondary" onclick="openProduct('${p.id}')">Editar</button>
          <button class="danger" onclick="deleteProduct('${p.id}')">Excluir</button>
        </div>
      </div>
    </div>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'
}

function renderStores(){
  $('storeList').innerHTML=state.stores.length?state.stores.map(s=>`
    <div class="list-row">
      <div class="thumb" style="display:grid;place-items:center;font-size:24px">🏪</div>
      <div><b>${esc(s.name)}</b><div class="meta">${esc(s.address||'Endereço não informado')}<br>${esc(s.phone||'')}</div></div>
      <button class="secondary" onclick="openStore('${s.id}')">Editar</button>
    </div>`).join(''):
    `<div class="empty">Nenhuma loja cadastrada.<br>
      <button class="primary" style="margin-top:12px" onclick="openStore()">Cadastrar primeira loja</button>
    </div>`
}

function renderCompare(){
  const select=$('compareProduct');if(!select)return;
  const old=select.value;
  select.innerHTML='<option value="">Selecione um produto</option>'+
    state.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  if(old)select.value=old;

  const p=state.products.find(x=>String(x.id)===String(select.value));
  if(!p){
    $('compareResult').innerHTML='<div class="card empty">Escolha um produto para comparar os preços.</div>';
    return;
  }

  const records=state.history.filter(h=>String(h.productId)===String(p.id));
  const bestByStore={};

  records.forEach(h=>{
    const key=h.storeId||'none';
    if(!bestByStore[key]||Number(h.price)<Number(bestByStore[key].price))bestByStore[key]=h;
  });

  if(!Object.keys(bestByStore).length)
    bestByStore[p.storeId||'none']={price:p.price,storeId:p.storeId};

  const values=Object.values(bestByStore).sort((a,b)=>Number(a.price)-Number(b.price));
  const min=Number(values[0].price);

  $('compareResult').innerHTML=values.map(v=>`
    <div class="card compare-card ${Number(v.price)===min?'best':''}">
      <div><b>${esc(storeName(v.storeId))}</b>
        <div class="meta">${Number(v.price)===min?'🏆 Melhor preço':'Preço cadastrado'}</div>
      </div>
      <strong class="price">${money(v.price)}</strong>
    </div>`).join('')
}

function renderHistory(){
  const list=state.history.slice(0,100);
  $('historyList').innerHTML=list.length?list.map(h=>{
    const p=state.products.find(x=>String(x.id)===String(h.productId));
    if(!p)return '';
    return `<div class="list-row">
      <img class="thumb" src="${productImage(p)}" alt="">
      <div><b>${esc(p.name)}</b><div class="meta">${esc(storeName(h.storeId))}<br>${new Date(h.date).toLocaleString('pt-BR')}</div></div>
      <b class="price">${money(h.price)}</b>
    </div>`
  }).join(''):'<div class="empty">O histórico aparecerá aqui quando você cadastrar preços.</div>'
}

function renderAll(){
  renderStats();renderFeatured();renderProducts();renderStores();renderCompare();renderHistory()
}

$('searchForm').onsubmit=e=>{
  e.preventDefault();
  const q=$('searchInput').value.trim();
  if(!q)return;
  state.searches++;
  save();
  go('products');
  $('productFilter').value=q;
  renderProducts()
};

$('modal').addEventListener('click',e=>{
  if(e.target.id==='modal')closeModal()
});

migrate();
renderAll();

/* Atualização do PWA: o nome da versão muda junto com o Service Worker. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js?v=5').catch(()=>{});
  });
}
</script>
</body>
</html>
